services:
  lucent:
    build: .
    container_name: hive-lucent
    restart: unless-stopped
    networks:
      # Join hive_mind's network so its containers can reach us as `hive-lucent:8424`.
      - hivemind
    ports:
      # Bind on 0.0.0.0 so remote minds on the LAN (and bare-metal Skippy
      # on this host) can reach lucent. Bearer-token auth gates every
      # non-health route, so LAN exposure is intentional.
      # Container-internal listeners come in via the `hivemind` network on
      # port 8424.
      - "0.0.0.0:8425:8424"
    environment:
      LUCENT_API_PORT: "8424"
      LUCENT_URL_SELF: "http://127.0.0.1:8424"
      LUCENT_DB_PATH: "/data/lucent.db"
      PRUNE_LOG_PATH: "/data/prune.log"
      PRUNE_CRON: "0 4 * * *"
      PRUNE_TIMEZONE: "America/Chicago"
      # LUCENT_BEARER_TOKEN — bind-mount or set via .env (F9)
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Bind-mount the API source so schema additions and hot fixes don't
      # require an image rebuild. Restart the container (no rebuild) to
      # pick up changes.
      - ./lucent_api:/app/lucent_api

  comms:
    build:
      context: .
      dockerfile: comms/Dockerfile
    container_name: hive-comms
    restart: unless-stopped
    networks:
      - hivemind
    # Resolve host.docker.internal to the host gateway on Linux so comms
    # can dispatch HTTP to bare-metal minds (e.g. Skippy at port 8421).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bind on 0.0.0.0 so remote minds on the LAN (and bare-metal Skippy
      # on this host) can reach the comms gateway. Bearer-token auth gates
      # every non-health route. Container-internal listeners come in via
      # the hivemind network on 8424.
      - "0.0.0.0:8426:8424"
    environment:
      COMMS_PORT: "8424"
      COMMS_PROJECT_DIR: "/app"
      BROKER_DB_PATH: "/data/broker.db"
      SESSIONS_DB_PATH: "/data/sessions.db"
      # COMMS_BEARER_TOKEN — wired in A2 via .env
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Bind-mount comms/ so code edits don't require a rebuild —
      # restart the container to pick up changes.
      - ./comms:/app/comms

networks:
  hivemind:
    external: true
    name: hivemind
